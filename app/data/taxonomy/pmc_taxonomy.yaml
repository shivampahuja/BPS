# ============================================================
# BEHAVIOR DEFINITIONS
# ============================================================

behaviors:
  empathy:
    label:
      en: "Empathy shown"
      cs: "Projevená empatie"
    description: "Agent demonstrated understanding, acknowledgment, or apology"
    sop_required: true

  authentication:
    label:
      en: "Authentication performed"
      cs: "Provedena autentifikace"
    description: "Agent verified customer identity per SOP"
    sop_required: true

  resolution_confirmation:
    label:
      en: "Resolution confirmed"
      cs: "Potvrzeno řešení"
    description: "Agent confirmed resolution before closing interaction"
    sop_required: true

  escalation:
    label:
      en: "Escalation triggered"
      cs: "Spuštěna eskalace"
    description: "Interaction was escalated to supervisor or senior agent"
    sop_required: false

  adverse_event:
    label:
      en: "Adverse event mentioned"
      cs: "Zmíněna nežádoucí událost"
    description: "Customer mentioned health/medical concern - requires safety routing"
    sop_required: true

# ============================================================
# COMPLIANCE FLAGS
# ============================================================

compliance_flags:
  authentication:
    label:
      en: "Authentication compliance"
      cs: "Soulad autentifikace"
    required: true
    severity: "high"

  adverse_event:
    label:
      en: "Adverse event routing"
      cs: "Směrování nežádoucích událostí"
    required: true
    severity: "critical"

  health_mention:
    label:
      en: "Health mention detected"
      cs: "Detekována zdravotní zmínka"
    required: true
    severity: "critical"

  age_verification:
    label:
      en: "Age verification required"
      cs: "Vyžadováno ověření věku"
    required: true
    severity: "high"

  nicotine_declaration:
    label:
      en: "Nicotine declaration"
      cs: "Prohlášení o nikotinu"
    required: true
    severity: "high"

  privacy:
    label:
      en: "Privacy/GDPR compliance"
      cs: "Soulad s ochranou soukromí/GDPR"
    required: true
